services:
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://appuser:rescue123@db:5432/appdb"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: rescue123
      POSTGRES_DB: appdb
